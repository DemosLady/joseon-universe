<style>
  :root{
    --ink:#0d1220;

  .hero .sub{

  details.prev{

  .panorama{ background-image:url("art/hero.jpg"); }

  <p class="eyebrow">DEMOSAII</p>
  <h1>인물</h1>
  <p class="sub">THE CHARACTERS</p>
</header>

<section class="intro">
  <p>세 세대에 걸쳐 이어지는 이야기입니다. 한 삼부작에서 사라진 사람이 다른 삼부작에서 돌아오고, 먼저 묻힌 것이 나중에 발견됩니다.</p>
</section>

<div class="backwrap"><button class="backbtn" type="button">← 읽던 곳으로 돌아가기</button></div>

<div class="cast">
  <div class="gen">
    <p class="gen-label">GENERATION ONE</p>
    <p class="gen-name">불의 삼부작</p>
        <figure id="king">
      <img class="portrait" src="portraits/king.png" alt="왕" loading="lazy">
      <div class="txt">
      <h3>왕</h3>
      <p class="role">임금 · 제1장</p>
      <p class="bio">이름은 이야기에 나오지 않는다. 온화하다는 말을 듣던 젊은 임금이었다. 사랑한 여인이 궁 안에서 독으로 죽고, 그 손이 자기 조정 안에 있었다는 것을 알아낸 날부터 달라졌다.<br><br>그날 이후 상소에 먹 대신 피를 찍었다. <b>온화하던 임금이 폭군이 되었다.</b> 그가 시작한 일이 세 세대를 건너간다.</p>
      <p class="appears">등장: <a href="tistory_ch1_blood_and_fog.html">제1장</a><br>곡: 왕의 길목 · 빈 궁궐 메아리 · 피의 옥새<br><span style="color:#66748c;">제8장의 왕은 이 왕의 후손입니다.</span></p>
    </div>
    </figure>

    <figure id="yeoni">
      <img class="portrait" src="portraits/yeoni.png" alt="연이" loading="lazy">
      <div class="txt">
      <h3>연이</h3>
      <p class="role">기록에서 지워진 여자 · 제1장</p>
      <p class="bio">실록에 한 줄도 남지 않았다. 이름은 지워졌고 무덤에는 표가 없다. 궁 안에서 독을 마시고 죽었으나, 그것이 누구의 손이었는지는 오래 밝혀지지 않았다.<br><br><b>이 이야기 전체가 이 여자에게서 시작된다.</b> 서른여섯 곡 가운데 그녀의 목소리로 부르는 곡은 하나뿐이다.</p>
      <p class="appears">등장: <a href="tistory_ch1_blood_and_fog.html">제1장</a><br>곡: 빈 궁궐 메아리 · 안개 속 그림자</p>
    </div>
    </figure>

<figure id="yunje">
      <img class="portrait" src="portraits/yunje.png" alt="윤제" loading="lazy">
      <div class="txt">
      <h3>윤제</h3>
      <p class="role">선비 · 제1~3장</p>
      <p class="bio">과거에 급제하고 사간원에 섰던 문신. 있었던 일을 있는 그대로 적었다는 죄로 제주에 유배된다. 유배지에서도 쓰기를 멈추지 않았고, 그 글은 뭍으로 건너가 노래가 되었다.<br><br><b>봉기가 실패한 뒤 형장에서 죽는다.</b> 마지막까지 후회는 없다고 했다.</p>
      <p class="appears">등장: <a href="tistory_ch1_blood_and_fog.html">제1장</a> · <a href="tistory_ch2_ink_and_embers.html">제2장</a> · <a href="tistory_ch3_ash_and_seed.html">제3장</a><br>곡: 붓끝에 칼 · 마지막 붓</p>
    </div>
    </figure>
    <figure id="talswe">
      <img class="portrait" src="portraits/talswe.png" alt="탈쇠" loading="lazy">
      <div class="txt">
      <h3>탈쇠</h3>
      <p class="role">광대 · 제2~3장</p>
      <p class="bio">저잣거리의 광대. 성이 없다. 낮에는 줄을 타고 밤에는 소식을 날랐고, 유배지에서 온 글을 자기 노래에 숨겨 한양까지 옮겼다.<br><br>봉기의 밤에 탈을 쓰고 궁궐 앞에 섰다. <b>살아남은 것은 그 하나뿐이었다.</b> 탈을 버리고 이야기꾼이 되어 남쪽으로 걸었다.</p>
      <p class="appears">등장: <a href="tistory_ch2_ink_and_embers.html">제2장</a> · <a href="tistory_ch3_ash_and_seed.html">제3장</a><br>곡: 저잣거리 · 길 위의 그림자</p>
    </div>
    </figure>
    <figure id="jeongan">
      <img class="portrait" src="portraits/jeongan.png" alt="정안" loading="lazy">
      <div class="txt">
      <h3>정안</h3>
      <p class="role">여인 · 제2~3장, 제6장</p>
      <p class="bio">사화로 아버지를 잃고 어머니를 노비로 빼앗긴 뒤 스물셋에 머리를 깎았다. 산에서 십 년, 그리고 횃불을 들고 내려왔다.<br><br>다 태우고 빈 손으로 돌아갔다. <b>한 세대 뒤, 바다에서 올라온 장부를 들고 세 사람이 그 여인을 찾아온다.</b></p>
      <p class="appears">등장: <a href="tistory_ch2_ink_and_embers.html">제2장</a> · <a href="tistory_ch3_ash_and_seed.html">제3장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a><br>곡: 산사의 여인 · 빈 산 · 산문 앞에서</p>
    </div>
    </figure>
    <figure id="buni">
      <div class="pair"><img class="portrait" src="portraits/buni_young.png" alt="분이 16" loading="lazy"><img class="portrait" src="portraits/buni.png" alt="분이 44" loading="lazy"><span class="cap">16세 &nbsp;·&nbsp; 44세</span></div>
      <div class="txt">
      <h3>분이</h3>
      <p class="role">소녀 · 제3장, 제7장</p>
      <p class="bio">전라도의 작은 마을에서 자랐다. 여자라서 글을 배우지 못했다. 열여섯에 할머니 방 마루 밑에서 종이 한 장을 찾아냈고, 사흘을 훈장 문 앞에 앉아 가르쳐 달라 했다.<br><br>사십 년 뒤, <b>마을의 훈장이 된 그 여자에게 바다에서 온 장부와 전쟁이 같은 주에 도착한다.</b><br><br>그녀가 아는 것은 두 가지다. 사람을 돌보는 일과 글이다. 북쪽에는 그 둘이 다 필요했고, 그 둘을 다 가진 사람은 드물었다. <b>죽는 사람의 손을 잡고, 그 이름을 듣고, 적는다.</b><br><br>전쟁이 끝나자 그녀는 바다에서 온 장부를 스무 살 병졸에게 맡긴다. <b>그가 오래 살 것 같아서였다.</b> 무엇이냐 묻지 말라 하였다.</p>
      <p class="appears">등장: <a href="tistory_ch3_ash_and_seed.html">제3장</a> · <a href="chapter7.html">제7장</a> · <a href="chapter8.html">제8장</a> · <a href="chapter9.html">제9장</a><br>곡: 첫 번째 새싹 · 빈 줄 · 이름을 듣소 · 봉인 · 소금 항아리</p>
    </div>
    </figure>
  </div>

  <div class="gen">
    <p class="gen-label">GENERATION TWO</p>
    <p class="gen-name">바다 삼부작</p>
    <figure id="sugyeom">
      <img class="portrait" src="portraits/sugyeom.png" alt="수겸" loading="lazy">
      <div class="txt">
      <h3>수겸</h3>
      <p class="role">선비 · 제4~6장</p>
      <p class="bio">윤제와 같은 죄로 같은 바다에 유배되었다. 섬에서 아이들에게 모래 위에 글자를 가르쳤다 — 파도가 지우는 곳에 쓴 글은 증거가 되지 않으니.<br><br><b>궤짝이 열렸을 때 그는 알았다.</b> 진실을 써서 유배된 것이 아니라, 진실이 묻힌 곳으로 보내졌다는 것을.</p>
      <p class="appears">등장: <a href="tistory_ch4_salt_and_waves.html">제4장</a> · <a href="tistory_ch5_sea_and_bones.html">제5장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a><br>곡: 유배길 · 소금 편지</p>
    </div>
    </figure>
    <figure id="baeswe">
      <img class="portrait" src="portraits/baeswe.png" alt="배쇠" loading="lazy">
      <div class="txt">
      <h3>배쇠</h3>
      <p class="role">밀수꾼 · 제4~7장</p>
      <p class="bio">성이 없다. 배를 타기 때문에 배쇠라 불렸다. 달이 구름에 숨는 밤에만 검게 물들인 돛을 올렸고, 삼십 년을 모르는 척하며 살아남았다.<br><br>가라앉은 배를 찾아낸 것도, 흰 돛을 처음 올린 것도 그였다. <b>그리고 북쪽이 뚫린 날, 그 돛을 스스로 내렸다.</b><br><br>삼십 년을 도망만 치던 사내가 처음으로 줄에 섰다. 그리고 전투가 끝난 아침, 왕 앞에서 품에 손을 넣었다가 <b>빈 손으로 뺐다.</b></p>
      <p class="appears">등장: <a href="tistory_ch4_salt_and_waves.html">제4장</a> · <a href="tistory_ch5_sea_and_bones.html">제5장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a> · <a href="chapter7.html">제7장</a> · <a href="chapter8.html">제8장</a><br>곡: 검은 돛 · 가라앉은 배 · 돛을 내리다 · 첫 줄 · 두 걸음</p>
    </div>
    </figure>
    <figure id="gapsu">
      <img class="portrait" src="portraits/gapsu.png" alt="갑수" loading="lazy">
      <div class="txt">
      <h3>갑수</h3>
      <p class="role">늙은 어부 · 제4~6장</p>
      <p class="bio">사십 년을 그 바다에서 살았다. 큰아들은 풍랑에, 작은아들은 열병에, 아내는 기다리다 먼저 갔다.<br><br>폭풍 속에서 바다에게 조용히 빌었다 — 가져갈 것이 있으면 나를 가져가고, 돌려줄 것이 있으면 이제는 돌려달라고. <b>다음 날 바다가 대답했다.</b></p>
      <p class="appears">등장: <a href="tistory_ch4_salt_and_waves.html">제4장</a> · <a href="tistory_ch5_sea_and_bones.html">제5장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a><br>곡: 늙은 그물 · 폭풍 · 북두칠성</p>
    </div>
    </figure>
    <figure id="oki">
      <img class="portrait" src="portraits/oki.png" alt="옥이" loading="lazy">
      <div class="txt">
      <h3>옥이</h3>
      <p class="role">해녀 · 제4~6장</p>
      <p class="bio">뭍에서는 고개를 숙이는 아낙이고 물속에서는 주인이다. 숨을 오래 참는 사람이 위고 못 참는 사람이 아래인 곳, 그것이 전부인 세계.<br><br>가라앉은 배를 처음 본 것도, 열두 사람의 이름을 데리고 올라온 것도 그녀다. <b>뭍으로 가는 배 위에서 그녀는 일어섰다 — 저기서 나는 이름도 글도 없는 아낙이오.</b></p>
      <p class="appears">등장: <a href="tistory_ch4_salt_and_waves.html">제4장</a> · <a href="tistory_ch5_sea_and_bones.html">제5장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a><br>곡: 숨비소리 · 물 아래 · 이어도</p>
    </div>
    </figure>
  </div>

  <div class="gen">
    <p class="gen-label">GENERATION THREE</p>
    <p class="gen-name">쇠 삼부작</p>
    <figure id="smith">
      <img class="portrait" src="portraits/smith.png" alt="대장장이" loading="lazy">
      <div class="txt"><h3>대장장이</h3>
      <p class="role">쇠를 녹이는 자 · 제7장</p>
      <p class="bio">이름이 나오지 않는다. 북쪽 국경 마을에서 사십 년을 대장간에 서 있었다. 전쟁이 나자 마을에서 쇠붙이란 쇠붙이는 모두 그의 마당에 실려 왔다.<br><br>절에서 온 종, 죄인의 사슬, 밥 짓던 솥, 어느 선비의 붓대에 박혀 있던 쇠. <b>저것이 무엇이냐 묻지 않는다. 쇠면 된다.</b><br><br>혼자 일한다. 원래 셋이 있었으나 먼저 북으로 갔다.</p>
      <p class="appears">등장: <a href="chapter7.html">제7장</a><br>곡: 모루</p></div>
    </figure>
  </div>

    <figure id="soldier">
      <img class="portrait" src="portraits/soldier.png" alt="병졸" loading="lazy">
      <div class="txt"><h3>병졸</h3>
      <p class="role">이름을 묻지 않은 자 · 제8~9장</p>
      <p class="bio">이름이 나오지 않는다. 스무 살에 전장에 나갔고, 갑옷이 몸에 맞지 않아 어깨가 흘러내렸다. 배쇠가 그의 옆에 섰지만 <b>끝내 이름을 묻지 않았다.</b><br><br>전투가 끝난 날, 글을 아는 여자가 그에게 젖은 장부를 맡긴다. 무엇이냐 묻지 말라 하였다. 그는 글을 몰라 읽지 못했고, <b>못 읽어서 지켰다.</b><br><br>아버지가 언 밭에서 그를 업고 왔다. 사십 일을 누워 있었다. 나아서는 어머니의 부엌, 소금 항아리 안에 그것을 묻는다.<br><br>육십 년 뒤, 손녀가 그것이 어디 있느냐 묻는다. 기억이 안 난다, 하였다. <b>정말 기억이 안 난 것인지는 아무도 모른다.</b></p>
      <p class="appears">등장: <a href="chapter8.html">제8장</a> · <a href="chapter9.html">제9장</a><br>곡: 첫 줄 · 언 밭 · 소금 항아리 · 우리 할아버지가요</p></div>
    </figure>

    <figure id="farmer">
      <img class="portrait" src="portraits/farmer.png" alt="농부" loading="lazy">
      <div class="txt"><h3>농부</h3>
      <p class="role">병졸의 아버지 · 제9장</p>
      <p class="bio">이름이 나오지 않는다. 싸우러 가지 않았다 — 갈 나이가 지났다 하였다. 그래서 밭에 남아 겨울을 났다.<br><br>작년에 종자를 다 먹었다. 겨울에 먹을 것이 없어서 심을 것을 먹었으니, 올해 심을 것이 없다. <b>그래도 밭을 간다.</b><br><br>어느 아침 삽이 무엇엔가 걸린다. 돌인 줄 알았는데 돌이 아니다. 어깨를 잡고 돌려보니 자기 아들이다.<br><br>업고 왔다. <b>가벼웠다 — 스무 해 키운 것이 그렇게 가벼울 수가 없었다.</b></p>
      <p class="appears">등장: <a href="chapter9.html">제9장</a><br>곡: 언 밭</p></div>
    </figure>

    <figure id="granddaughter">
      <img class="portrait" src="portraits/granddaughter.png" alt="손녀" loading="lazy">
      <div class="txt"><h3>손녀</h3>
      <p class="role">묻는 사람 · 제9장</p>
      <p class="bio">열다섯 살. 이름이 나오지 않는다. 글을 배우러 다니는데, 훈장이 어른들한테 옛날 얘기를 여쭤보고 오라 하였다.<br><br>할아버지밖에 없어서 할아버지한테 갔다. 전쟁 얘기를 여쭀더니 자꾸 소 얘기만 하신다. 어깨를 보여주실 때는 웃었고, <b>그다음 얘기를 하실 때 목소리가 작아지는 것을 알아챘다.</b><br><br>그 종이 어디 있어요, 하고 여쭀다. 기억이 안 난다 하셨다. 한 번만 더 여쭤볼걸 그랬다.<br><br>어디 있는지는 모른다. <b>있었다는 것만 안다. 그리고 그 얘기를 지금 또 하고 있다.</b></p>
      <p class="appears">등장: <a href="chapter9.html">제9장</a><br>곡: 우리 할아버지가요</p></div>
    </figure>
