<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d1220;
    --ink-deep:#070b14;
    --hanji:#efe8d8;
    --moon:#cfd6e4;
    --seal:#8c2f2a;
    --fire:#a8402f;      /* trilogy one */
    --sea:#2f7d8c;       /* trilogy two */
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 50% 300px, rgba(214,224,240,.10) 0 190px, rgba(214,224,240,.035) 191px 230px, transparent 231px),
      radial-gradient(120% 80% at 50% -10%, #1b2436 0%, var(--ink) 55%, var(--ink-deep) 100%);
    position:relative;
    color:var(--moon);
    font-family:"Nanum Myeongjo", serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---------- hero ---------- */
  .hero{
    max-width:780px;
    margin:0 auto;
    padding:110px 24px 0;
    text-align:center;
  }
  .eyebrow{
    font-family:"Gowun Dodum", sans-serif;
    font-size:11.5px;
    letter-spacing:.44em;
    text-indent:.44em;
    color:#7d8ba6;
    margin:0 0 38px;
  }
  .hero h1{
    font-family:"Song Myung", serif;
    font-size:clamp(38px,8vw,68px);
    font-weight:400;
    letter-spacing:.1em;
    text-indent:.1em;
    line-height:1.3;
    margin:0;
    color:#f2f4f8;
  }
  .hero .sub{
    font-family:"Gowun Dodum", sans-serif;
    font-size:12px;
    letter-spacing:.28em;
    text-indent:.28em;
    color:#6f7d96;
    margin:26px 0 0;
  }

  /* ---------- motto ---------- */
  .motto{
    max-width:620px;
    margin:64px auto 0;
    padding:0 24px;
    text-align:center;
    font-family:"Song Myung", serif;
    font-size:clamp(16px,3.4vw,19px);
    line-height:2.3;
    color:#aab6cb;
    letter-spacing:.05em;
    word-break:keep-all;
  }
  .motto span{ display:block; }
  .motto span + span{ color:#7d8ba6; }

  /* ---------- intro ---------- */
  .intro{
    max-width:600px;
    margin:60px auto 0;
    padding:0 24px;
    text-align:center;
    font-family:"Gowun Dodum", sans-serif;
    font-size:14.5px;
    line-height:2.15;
    color:#8b98b0;
    word-break:keep-all;
  }
  .intro p{ margin:0 0 14px; }
  .intro b{ color:#dfe4ee; font-weight:400; }

  /* ---------- chapters ---------- */
  .chapters{
    max-width:700px;
    margin:86px auto 0;
    padding:0 24px;
  }
  .part{
    font-family:"Gowun Dodum", sans-serif;
    font-size:11px;
    letter-spacing:.4em;
    text-indent:.4em;
    color:#66748c;
    margin:0 0 6px;
    text-align:center;
  }
  .part-kr{
    font-family:"Song Myung", serif;
    font-size:17px;
    letter-spacing:.24em;
    text-indent:.24em;
    color:#c3ccdc;
    text-align:center;
    margin:0 0 26px;
  }
  .part-kr + ol{ margin-bottom:64px; }

  ol.list{
    list-style:none;
    margin:0;
    padding:0;
    border-top:1px solid rgba(143,158,186,.14);
  }
  ol.list li{ border-bottom:1px solid rgba(143,158,186,.14); }

  ol.list a,
  ol.list .soon{
    display:flex;
    align-items:center;
    gap:20px;
    padding:18px 6px;
    text-decoration:none;
    color:inherit;
    transition:background .25s ease, padding-left .25s ease;
  }

  /* cover thumbnail */
  .cover{
    width:78px;
    height:78px;
    flex:0 0 78px;
    object-fit:cover;
    background:#161d2c;
    filter:saturate(.55) brightness(.82);
    transition:filter .35s ease, transform .35s ease;
  }
  ol.list a:hover .cover,
  ol.list a:focus .cover{
    filter:saturate(1) brightness(1);
    transform:scale(1.03);
  }
  .soon .cover{ filter:saturate(.15) brightness(.6); }

  /* the two trilogies carry their own colour */
  .fire .part{ color:#a8695c; }
  .fire .part-kr{ color:#dcbcb2; }
  .fire ol.list a:hover, .fire ol.list a:focus{ background:rgba(168,64,47,.10); }
  .fire .no{ color:#9c6559; }
  .fire ol.list li{ border-bottom-color:rgba(168,64,47,.20); }
  .fire ol.list{ border-top-color:rgba(168,64,47,.20); }

  .sea .part{ color:#6fa3ad; }
  .sea .part-kr{ color:#b3d2d8; }
  .sea ol.list a:hover, .sea ol.list a:focus{ background:rgba(47,125,140,.10); }
  .sea .no{ color:#5e8f99; }
  .sea ol.list li{ border-bottom-color:rgba(47,125,140,.20); }
  .sea ol.list{ border-top-color:rgba(47,125,140,.20); }

  /* thin rule under each trilogy heading */
  .part-kr::after{
    content:"";
    display:block;
    width:34px;
    height:1px;
    margin:16px auto 0;
    background:currentColor;
    opacity:.5;
  }
  ol.list a:hover,
  ol.list a:focus{
    background:rgba(207,214,228,.05);
    padding-left:16px;
  }
  .no{
    font-family:"Gowun Dodum", sans-serif;
    font-size:10.5px;
    letter-spacing:.2em;
    color:#5d6a80;
    white-space:nowrap;
    padding-top:4px;
  }
  .t{ flex:1; min-width:0; }
  .t .kr{
    font-family:"Song Myung", serif;
    font-size:21px;
    letter-spacing:.06em;
    color:#e6ebf4;
    display:block;
    margin-bottom:7px;
  }
  .t .desc{
    font-family:"Nanum Myeongjo", serif;
    font-size:14px;
    line-height:1.85;
    color:#7f8da5;
    display:block;
    word-break:keep-all;
  }
  .go{
    font-family:"Gowun Dodum", sans-serif;
    font-size:11px;
    letter-spacing:.16em;
    color:#8f9db5;
    white-space:nowrap;
    padding-top:6px;
  }
  ol.list a:hover .go{ color:var(--moon); }

  .soon{ opacity:.4; cursor:default; }
  .soon .go{ color:#66748c; }

  /* ---------- listen ---------- */
  .listen{
    max-width:700px;
    margin:34px auto 0;
    padding:52px 24px 0;
    border-top:1px solid rgba(143,158,186,.14);
    text-align:center;
  }
  .listen h2{
    font-family:"Song Myung", serif;
    font-weight:400;
    font-size:19px;
    letter-spacing:.18em;
    text-indent:.18em;
    color:#dfe4ee;
    margin:0 0 14px;
  }
  .listen p{
    font-family:"Gowun Dodum", sans-serif;
    font-size:13.5px;
    line-height:2;
    color:#8492ab;
    margin:0 0 26px;
    word-break:keep-all;
  }
  .btn{
    display:inline-block;
    font-family:"Gowun Dodum", sans-serif;
    font-size:13px;
    letter-spacing:.14em;
    color:#e6ebf4;
    text-decoration:none;
    border:1px solid rgba(207,214,228,.32);
    padding:14px 30px;
    transition:border-color .25s ease, background .25s ease;
  }
  .btn:hover, .btn:focus{
    border-color:var(--moon);
    background:rgba(207,214,228,.06);
  }

  /* ---------- about ---------- */
  .about{
    max-width:640px;
    margin:90px auto 0;
    padding:44px 24px 130px;
    border-top:1px solid rgba(143,158,186,.14);
    font-family:"Gowun Dodum", sans-serif;
    font-size:13.5px;
    line-height:2.05;
    color:#8492ab;
    text-align:center;
    word-break:keep-all;
  }
  .about p{ margin:0 0 16px; }
  .about-name{
    font-family:"Song Myung", serif;
    font-size:19px;
    letter-spacing:.2em;
    text-indent:.2em;
    color:#dfe4ee;
  }
  .about-tags{
    font-size:11.5px;
    color:#5d6a80;
    letter-spacing:.04em;
  }

  a:focus-visible{ outline:2px solid var(--moon); outline-offset:3px; }

  @media (max-width:640px){
    .hero{ padding-top:76px; }
    .chapters{ margin-top:64px; }
    .t .kr{ font-size:19px; }
    .go{ display:none; }
    ol.list a, ol.list .soon{ gap:14px; padding:16px 4px; }
    .cover{ width:62px; height:62px; flex-basis:62px; }
  }

  @media (prefers-reduced-motion:no-preference){
    .hero, .motto, .intro, .chapters{ animation:rise .9s ease-out both; }
    .motto{ animation-delay:.1s; }
    .intro{ animation-delay:.18s; }
    .chapters{ animation-delay:.26s; }
    @keyframes rise{
      from{ opacity:0; transform:translateY(14px); }
      to{ opacity:1; transform:none; }
    }
  }

  /* ---------- top bar: language switch ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    max-width:660px; margin:0 auto; padding:24px 24px 0;
    font-family:"Gowun Dodum", sans-serif; font-size:12px;
  }
  .topbar .home{ color:#8492ab; text-decoration:none; letter-spacing:.1em; }
  .topbar .home:hover{ color:#cfd6e4; }
  .langwrap{ position:relative; }
  .langbtn{
    background:none; border:1px solid rgba(143,158,186,.3); color:#aab6cb;
    font-family:"Gowun Dodum", sans-serif; font-size:11.5px; letter-spacing:.12em;
    padding:7px 14px; cursor:pointer; display:flex; align-items:center; gap:8px;
    transition:border-color .2s ease, color .2s ease;
  }
  .langbtn:hover{ border-color:rgba(207,214,228,.6); color:#e6ebf4; }
  .langbtn .caret{ font-size:9px; opacity:.7; }
  .langmenu{
    position:absolute; top:calc(100% + 6px); inset-inline-end:0; min-width:132px;
    background:#141b2a; border:1px solid rgba(143,158,186,.24);
    display:none; z-index:20;
  }
  .langmenu.open{ display:block; }
  .langmenu a{
    display:block; padding:11px 16px; color:#aab6cb; text-decoration:none;
    font-family:"Gowun Dodum", sans-serif; font-size:12px; letter-spacing:.06em;
    border-bottom:1px solid rgba(143,158,186,.14);
  }
  .langmenu a:last-child{ border-bottom:none; }
  .langmenu a:hover, .langmenu a:focus{ background:rgba(207,214,228,.08); color:#fff; }
  .langmenu a[aria-current="true"]{ color:#fff; }
  .langmenu a[aria-current="true"]::before{ content:"· "; color:var(--seal); }

  /* ---------- lyrics link inside the listen block ---------- */
  .lyrics-link{
    display:inline-block; margin:24px 0 0;
    font-family:"Gowun Dodum", sans-serif; font-size:13px; letter-spacing:.1em;
    color:#cfd6e4; text-decoration:none;
    border-bottom:1px solid rgba(207,214,228,.32); padding-bottom:3px;
  }
  .lyrics-link:hover, .lyrics-link:focus{ color:#fff; border-color:#fff; }

  /* ---------- next chapter button ---------- */
  .nextnav{
    max-width:660px; margin:0 auto; padding:0 24px 30px;
  }
  .nextnav a{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    text-decoration:none; color:inherit;
    border:1px solid rgba(143,158,186,.24);
    padding:26px 28px;
    transition:border-color .25s ease, background .25s ease;
  }
  .nextnav a:hover, .nextnav a:focus{
    border-color:rgba(207,214,228,.55);
    background:rgba(207,214,228,.05);
  }
  .nextnav .lbl{
    font-family:"Gowun Dodum", sans-serif; font-size:10.5px; letter-spacing:.34em;
    color:#66748c; display:block; margin-bottom:9px;
  }
  .nextnav .ttl{
    font-family:"Song Myung", serif; font-size:23px; letter-spacing:.05em; color:#e6ebf4;
    display:block;
  }
  .nextnav .dsc{
    font-family:"Nanum Myeongjo", serif; font-size:13.5px; color:#7f8da5;
    display:block; margin-top:8px;
  }
  .nextnav .arrow{
    font-family:"Gowun Dodum", sans-serif; font-size:20px; color:#8f9db5; flex:0 0 auto;
  }
  .nextnav a:hover .arrow{ color:#cfd6e4; }
  .nextnav.done a{ border-style:dashed; }

  @media (max-width:640px){
    .nextnav a{ padding:20px; }
    .nextnav .ttl{ font-size:20px; }
    .nextnav .arrow{ display:none; }
  }


  /* ---------- faint panorama behind everything ---------- */
  .panorama{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:url("art/hero.jpg");
    background-size:cover;
    background-position:center 42%;
    background-repeat:no-repeat;
    opacity:.10;
    filter:grayscale(.35) contrast(.9);
    mix-blend-mode:screen;
  }
  /* keep all real content above it */
  body > *:not(.panorama){ position:relative; z-index:1; }
  body > .topbar{ z-index:60; }   /* the language menu must sit above everything below it */

  @media (max-width:760px){
    .panorama{ opacity:.07; background-position:center 50%; }
  }


  /* ---------- story summary page ---------- */
  .sum{ max-width:680px; margin:0 auto; padding:0 24px; }
  .sum .part{ margin:78px 0 0; }
  .sum .part-label{
    font-family:"Gowun Dodum", sans-serif; font-size:11px;
    letter-spacing:.4em; text-indent:.4em; color:#66748c;
    margin:0 0 6px; text-align:center;
  }
  .sum .part-name{
    font-family:"Song Myung", serif; font-size:20px;
    letter-spacing:.22em; text-indent:.22em; color:#c3ccdc;
    text-align:center; margin:0 0 34px;
  }
  .sum article{
    border-top:1px solid rgba(143,158,186,.14);
    padding:30px 0 0; margin:0 0 34px;
  }
  .sum h3{
    font-family:"Song Myung", serif; font-weight:400; font-size:19px;
    letter-spacing:.05em; color:#e6ebf4; margin:0 0 4px;
  }
  .sum .ch-no{
    font-family:"Gowun Dodum", sans-serif; font-size:10.5px;
    letter-spacing:.3em; color:#66748c; margin:0 0 10px;
  }
  .sum p.body{
    font-family:"Nanum Myeongjo", serif; font-size:15.5px; line-height:2.05;
    color:#9aa7bd; margin:0 0 14px; word-break:keep-all;
  }
  .sum p.body b{ color:#cfd6e4; font-weight:400; }
  .sum .read{
    display:inline-block; font-family:"Gowun Dodum", sans-serif;
    font-size:11.5px; letter-spacing:.14em; color:#aab6cb;
    text-decoration:none; border-bottom:1px solid rgba(143,158,186,.28);
    padding-bottom:2px;
  }
  .sum .read:hover{ color:#fff; border-color:#fff; }
  .sum .wip{
    font-family:"Gowun Dodum", sans-serif; font-size:11.5px;
    letter-spacing:.14em; color:#66748c;
  }
  .sum .spoiler{
    margin:40px 0 0; padding:18px 20px;
    border:1px solid rgba(143,158,186,.16);
    font-family:"Gowun Dodum", sans-serif; font-size:12.5px;
    line-height:1.9; color:#7d8ba6; text-align:center;
  }

  /* ---------- previously box on chapter pages ---------- */
  details.prev{
    max-width:680px; margin:0 auto 34px; padding:0 24px;
    font-family:"Gowun Dodum", sans-serif;
  }
  details.prev summary{
    cursor:pointer; list-style:none;
    font-size:11.5px; letter-spacing:.22em; color:#7d8ba6;
    padding:12px 0; border-top:1px solid rgba(143,158,186,.14);
    border-bottom:1px solid rgba(143,158,186,.14);
  }
  details.prev summary::-webkit-details-marker{ display:none; }
  details.prev summary::after{ content:" ▾"; color:#66748c; }
  details.prev[open] summary::after{ content:" ▴"; }
  details.prev .inner{
    padding:20px 0 4px;
    font-family:"Nanum Myeongjo", serif; font-size:14.5px;
    line-height:2.0; color:#8b98b0; word-break:keep-all;
  }
  details.prev .inner a{
    color:#aab6cb; text-decoration:none;
    border-bottom:1px solid rgba(143,158,186,.28);
  }
  details.prev .inner a:hover{ color:#fff; }

  .panorama{ background-image:url("art/hero.jpg"); }

  /* ---------- characters ---------- */
  .cast{ max-width:700px; margin:0 auto; padding:0 24px; }
  .cast .gen{ margin:74px 0 0; }
  .cast .gen-label{
    font-family:"Gowun Dodum", sans-serif; font-size:11px;
    letter-spacing:.4em; text-indent:.4em; color:#66748c;
    margin:0 0 6px; text-align:center;
  }
  .cast .gen-name{
    font-family:"Song Myung", serif; font-size:19px;
    letter-spacing:.22em; text-indent:.22em; color:#c3ccdc;
    text-align:center; margin:0 0 32px;
  }
  .cast figure{
    margin:0 0 30px; padding:26px 0 0;
    border-top:1px solid rgba(143,158,186,.14);
  }
  .cast h3{
    font-family:"Song Myung", serif; font-weight:400; font-size:21px;
    letter-spacing:.05em; color:#e6ebf4; margin:0 0 3px;
  }
  .cast .role{
    font-family:"Gowun Dodum", sans-serif; font-size:11px;
    letter-spacing:.24em; color:#7d8ba6; margin:0 0 14px;
  }
  .cast p.bio{
    font-family:"Nanum Myeongjo", serif; font-size:15px; line-height:2.05;
    color:#9aa7bd; margin:0 0 12px; word-break:keep-all;
  }
  .cast p.bio b{ color:#cfd6e4; font-weight:400; }
  .cast .appears{
    font-family:"Gowun Dodum", sans-serif; font-size:11.5px;
    letter-spacing:.06em; color:#66748c; line-height:1.9;
  }
  .cast .appears a{
    color:#8fa0bb; text-decoration:none;
    border-bottom:1px solid rgba(143,158,186,.22);
  }
  .cast .appears a:hover{ color:#fff; }
  .cast .quote{
    font-family:"Song Myung", serif; font-size:14.5px; line-height:2;
    color:#aab6cb; margin:0 0 12px; padding-inline-start:16px;
    border-inline-start:1px solid rgba(143,158,186,.24);
    word-break:keep-all;
  }

  /* ---------- coming-soon chapter page ---------- */
  .soonpage{ max-width:680px; margin:0 auto; padding:0 24px; }
  .soonpage .badge{
    display:inline-block; font-family:"Gowun Dodum", sans-serif;
    font-size:10.5px; letter-spacing:.3em; color:#66748c;
    border:1px solid rgba(143,158,186,.22); padding:7px 14px; margin:0 0 26px;
  }
  .soonpage .coverwrap{ margin:0 0 34px; }
  .soonpage .coverwrap img{ width:100%; height:auto; display:block; }
  .soonpage p.body{
    font-family:"Nanum Myeongjo", serif; font-size:16px; line-height:2.1;
    color:#9aa7bd; margin:0 0 18px; word-break:keep-all;
  }
  .soonpage p.body b{ color:#cfd6e4; font-weight:400; }
  .soonpage .tracks{
    margin:34px 0 0; padding:26px 0 0;
    border-top:1px solid rgba(143,158,186,.14);
    list-style:none;
  }
  .soonpage .tracks li{
    font-family:"Nanum Myeongjo", serif; font-size:15px;
    color:#9aa7bd; line-height:2.2; display:flex; gap:14px;
  }
  .soonpage .tracks .tn{
    font-family:"Gowun Dodum", sans-serif; font-size:11px;
    letter-spacing:.2em; color:#66748c; min-width:34px;
  }

  /* ---------- video embed on chapter pages ---------- */
  .filmwrap{
    max-width:680px; margin:0 auto 40px; padding:0 24px;
  }
  .filmwrap .label{
    font-family:"Gowun Dodum", sans-serif; font-size:11px;
    letter-spacing:.28em; color:#7d8ba6; margin:0 0 14px; text-align:center;
  }
  .filmwrap .frame{
    position:relative; width:100%; max-width:340px; margin:0 auto;
    aspect-ratio:9/16; background:#0b1018;
    border:1px solid rgba(143,158,186,.16);
  }
  .filmwrap .frame iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }

  .panorama{ background-image:url("art/hero.jpg"); }

  /* ---------- back button on the characters page ---------- */
  .backwrap{ max-width:700px; margin:0 auto; padding:0 24px 8px; }
  .backbtn{
    display:none; align-items:center; gap:8px;

  <p class="eyebrow">DEMOSAII</p>
  <h1>인물</h1>

<section class="intro">
  <p>세 세대에 걸쳐 이어지는 이야기입니다. 한 삼부작에서 사라진 사람이 다른 삼부작에서 돌아오고, 먼저 묻힌 것이 나중에 발견됩니다.</p>
</section>

<div class="backwrap"><button class="backbtn" type="button">← 읽던 곳으로 돌아가기</button></div>

<div class="cast">
  <div class="gen">
    <p class="gen-label">GENERATION ONE</p>
    <p class="gen-name">불의 삼부작</p>
        <figure id="king">
      <img class="portrait" src="portraits/king.png" alt="왕" loading="lazy">
      <div class="txt">
      <h3>왕</h3>
      <p class="role">임금 · 제1장</p>
      <p class="bio">이름은 이야기에 나오지 않는다. 온화하다는 말을 듣던 젊은 임금이었다. 사랑한 여인이 궁 안에서 독으로 죽고, 그 손이 자기 조정 안에 있었다는 것을 알아낸 날부터 달라졌다.<br><br>그날 이후 상소에 먹 대신 피를 찍었다. <b>온화하던 임금이 폭군이 되었다.</b> 그가 시작한 일이 세 세대를 건너간다.</p>
      <p class="appears">등장: <a href="tistory_ch1_blood_and_fog.html">제1장</a><br>곡: 왕의 길목 · 빈 궁궐 메아리 · 피의 옥새</p>
    </div>
    </figure>

    <figure id="yeoni">
      <img class="portrait" src="portraits/yeoni.png" alt="연이" loading="lazy">
      <div class="txt">
      <h3>연이</h3>
      <p class="role">기록에서 지워진 여자 · 제1장</p>
      <p class="bio">실록에 한 줄도 남지 않았다. 이름은 지워졌고 무덤에는 표가 없다. 궁 안에서 독을 마시고 죽었으나, 그것이 누구의 손이었는지는 오래 밝혀지지 않았다.<br><br><b>이 이야기 전체가 이 여자에게서 시작된다.</b> 스물여덟 곡 가운데 그녀의 목소리로 부르는 곡은 하나뿐이다.</p>
      <p class="appears">등장: <a href="tistory_ch1_blood_and_fog.html">제1장</a><br>곡: 빈 궁궐 메아리 · 안개 속 그림자</p>
    </div>
    </figure>

<figure id="yunje">
      <img class="portrait" src="portraits/yunje.png" alt="윤제" loading="lazy">
      <div class="txt">
      <h3>윤제</h3>
      <p class="role">선비 · 제1~3장</p>
      <p class="bio">과거에 급제하고 사간원에 섰던 문신. 있었던 일을 있는 그대로 적었다는 죄로 제주에 유배된다. 유배지에서도 쓰기를 멈추지 않았고, 그 글은 뭍으로 건너가 노래가 되었다.<br><br><b>봉기가 실패한 뒤 형장에서 죽는다.</b> 마지막까지 후회는 없다고 했다.</p>
      <p class="appears">등장: <a href="tistory_ch1_blood_and_fog.html">제1장</a> · <a href="tistory_ch2_ink_and_embers.html">제2장</a> · <a href="tistory_ch3_ash_and_seed.html">제3장</a><br>곡: 붓끝에 칼 · 마지막 붓</p>
    </div>
    </figure>
    <figure id="talswe">
      <img class="portrait" src="portraits/talswe.png" alt="탈쇠" loading="lazy">
      <div class="txt">
      <h3>탈쇠</h3>
      <p class="role">광대 · 제2~3장</p>
      <p class="bio">저잣거리의 광대. 성이 없다. 낮에는 줄을 타고 밤에는 소식을 날랐고, 유배지에서 온 글을 자기 노래에 숨겨 한양까지 옮겼다.<br><br>봉기의 밤에 탈을 쓰고 궁궐 앞에 섰다. <b>살아남은 것은 그 하나뿐이었다.</b> 탈을 버리고 이야기꾼이 되어 남쪽으로 걸었다.</p>
      <p class="appears">등장: <a href="tistory_ch2_ink_and_embers.html">제2장</a> · <a href="tistory_ch3_ash_and_seed.html">제3장</a><br>곡: 저잣거리 · 길 위의 그림자</p>
    </div>
    </figure>
    <figure id="jeongan">
      <img class="portrait" src="portraits/jeongan.png" alt="정안" loading="lazy">
      <div class="txt">
      <h3>정안</h3>
      <p class="role">여인 · 제2~3장, 제6장</p>
      <p class="bio">사화로 아버지를 잃고 어머니를 노비로 빼앗긴 뒤 스물셋에 머리를 깎았다. 산에서 십 년, 그리고 횃불을 들고 내려왔다.<br><br>다 태우고 빈 손으로 돌아갔다. <b>한 세대 뒤, 바다에서 올라온 장부를 들고 세 사람이 그 여인을 찾아온다.</b></p>
      <p class="appears">등장: <a href="tistory_ch2_ink_and_embers.html">제2장</a> · <a href="tistory_ch3_ash_and_seed.html">제3장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a><br>곡: 산사의 여인 · 빈 산 · 산문 앞에서</p>
    </div>
    </figure>
    <figure id="buni">
      <div class="pair"><img class="portrait" src="portraits/buni_young.png" alt="분이 16" loading="lazy"><img class="portrait" src="portraits/buni.png" alt="분이 44" loading="lazy"><span class="cap">16세 &nbsp;·&nbsp; 44세</span></div>
      <div class="txt">
      <h3>분이</h3>
      <p class="role">소녀 · 제3장, 제7장</p>
      <p class="bio">전라도의 작은 마을에서 자랐다. 여자라서 글을 배우지 못했다. 열여섯에 할머니 방 마루 밑에서 종이 한 장을 찾아냈고, 사흘을 훈장 문 앞에 앉아 가르쳐 달라 했다.<br><br>사십 년 뒤, <b>마을의 훈장이 된 그 여자에게 바다에서 온 장부와 전쟁이 같은 주에 도착한다.</b></p>
      <p class="appears">등장: <a href="tistory_ch3_ash_and_seed.html">제3장</a> · <a href="chapter7.html">제7장</a><br>곡: 첫 번째 새싹 · 빈 줄</p>
    </div>
    </figure>
  </div>

  <div class="gen">
    <p class="gen-label">GENERATION TWO</p>
    <p class="gen-name">바다 삼부작</p>
    <figure id="sugyeom">
      <img class="portrait" src="portraits/sugyeom.png" alt="수겸" loading="lazy">
      <div class="txt">
      <h3>수겸</h3>
      <p class="role">선비 · 제4~6장</p>
      <p class="bio">윤제와 같은 죄로 같은 바다에 유배되었다. 섬에서 아이들에게 모래 위에 글자를 가르쳤다 — 파도가 지우는 곳에 쓴 글은 증거가 되지 않으니.<br><br><b>궤짝이 열렸을 때 그는 알았다.</b> 진실을 써서 유배된 것이 아니라, 진실이 묻힌 곳으로 보내졌다는 것을.</p>
      <p class="appears">등장: <a href="tistory_ch4_salt_and_waves.html">제4장</a> · <a href="tistory_ch5_sea_and_bones.html">제5장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a><br>곡: 유배길 · 소금 편지</p>
    </div>
    </figure>
    <figure id="baeswe">
      <img class="portrait" src="portraits/baeswe.png" alt="배쇠" loading="lazy">
      <div class="txt">
      <h3>배쇠</h3>
      <p class="role">밀수꾼 · 제4~7장</p>
      <p class="bio">성이 없다. 배를 타기 때문에 배쇠라 불렸다. 달이 구름에 숨는 밤에만 검게 물들인 돛을 올렸고, 삼십 년을 모르는 척하며 살아남았다.<br><br>가라앉은 배를 찾아낸 것도, 흰 돛을 처음 올린 것도 그였다. <b>그리고 북쪽이 뚫린 날, 그 돛을 스스로 내렸다.</b></p>
      <p class="appears">등장: <a href="tistory_ch4_salt_and_waves.html">제4장</a> · <a href="tistory_ch5_sea_and_bones.html">제5장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a> · <a href="chapter7.html">제7장</a><br>곡: 검은 돛 · 가라앉은 배 · 돛을 내리다</p>
    </div>
    </figure>
    <figure id="gapsu">
      <img class="portrait" src="portraits/gapsu.png" alt="갑수" loading="lazy">
      <div class="txt">
      <h3>갑수</h3>
      <p class="role">늙은 어부 · 제4~6장</p>
      <p class="bio">사십 년을 그 바다에서 살았다. 큰아들은 풍랑에, 작은아들은 열병에, 아내는 기다리다 먼저 갔다.<br><br>폭풍 속에서 바다에게 조용히 빌었다 — 가져갈 것이 있으면 나를 가져가고, 돌려줄 것이 있으면 이제는 돌려달라고. <b>다음 날 바다가 대답했다.</b></p>
      <p class="appears">등장: <a href="tistory_ch4_salt_and_waves.html">제4장</a> · <a href="tistory_ch5_sea_and_bones.html">제5장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a><br>곡: 늙은 그물 · 폭풍 · 북두칠성</p>
    </div>
    </figure>
    <figure id="oki">
      <img class="portrait" src="portraits/oki.png" alt="옥이" loading="lazy">
      <div class="txt">
      <h3>옥이</h3>
      <p class="role">해녀 · 제4~6장</p>
      <p class="bio">뭍에서는 고개를 숙이는 아낙이고 물속에서는 주인이다. 숨을 오래 참는 사람이 위고 못 참는 사람이 아래인 곳, 그것이 전부인 세계.<br><br>가라앉은 배를 처음 본 것도, 열두 사람의 이름을 데리고 올라온 것도 그녀다. <b>뭍으로 가는 배 위에서 그녀는 일어섰다 — 저기서 나는 이름도 글도 없는 아낙이오.</b></p>
      <p class="appears">등장: <a href="tistory_ch4_salt_and_waves.html">제4장</a> · <a href="tistory_ch5_sea_and_bones.html">제5장</a> · <a href="tistory_ch6_island_and_stars.html">제6장</a><br>곡: 숨비소리 · 물 아래 · 이어도</p>
    </div>
    </figure>
  </div>
</div>
