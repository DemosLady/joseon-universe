s had passed and it was still there","I took it to the village teacher","He read for a long time and then wept","Is this that scholar's writing","Is this the writing that tried to wake the world","That night I said to the teacher","Please teach me to write","He said a girl may not","Every dawn I sat at his door","On the morning of the third day, the door opened","Beneath the ash there was a seed","No one knew. I didn't know either.","Then rain came, and spring came","And it broke through the soil","I am the first sprout","You thought it burned, you thought it ended","But here it is","A new letter risen from the earth","The day I first held a brush","My hand shook","I ground the ink and drew a first stroke on the hanji","It came out crooked","And still, it was a letter","The scholar died, but the brush is here","The clown vanished, but the story is here","The nun went back to the mountain, but the ember is here","Under the floorboards","And in my hand","Beneath the ash there was a seed","That seed was me","Rain came, and spring came","And at last I came out","I am the first sprout","I don't know how far this writing will go","But I write","I carry on what the scholar began","Ink and embers","Ash and seed","This is not the end","It is the beginning"],"url":"lyrics-ch3.html"},{"a":4,"akr":"소금과 파도","aen":"Salt and Waves","tri":"sea","t":1,"kr":"유배길 (Road of Exile) — The Scholar","en":"","L":["죄인은 들으라","붓으로 나라를 어지럽힌 죄","남녘 끝 섬으로 유배를 명하노라","한양의 문이 등 뒤에서 닫히고","새벽 안개가 내 이름을 지운다","갓은 벗겨지고 도포는 헤지고","남은 것은 먹물 든 손가락뿐","포졸의 발소리 쇠사슬 소리","천 리 길이 발 아래 놓였다","내가 쓴 것은 거짓이 아니었다","진실이 죄가 되는 나라였다","유배길 유배길","남녘으로 남녘으로","붓은 꺾여도 먹은 마르지 않아","유배길 유배길","바다가 나를 부른다","논밭이 끝나고 돌담이 낮아지고","바람에서 소금 냄새가 난다","주막의 노파가 국 한 그릇 내밀며","아무 말 없이 고개를 숙인다","백성은 안다 누가 죄인인지","궐 안의 그들인지 길 위의 나인지","손은 묶어도 글은 묶지 못하니","머릿속에 천 장의 종이가 있다","유배길 유배길","남녘으로 남녘으로","붓은 꺾여도 먹은 마르지 않아","유배길 유배길","바다가 나를 부른다","고개를 넘자 세상이 끝났다","아니 끝난 곳에서 바다가 시작했다","파도가 밀려와 내 발목을 잡고","수평선이 내 형량을 읽는다","사공이 노를 젓고 갈매기 울고","뒤돌아보면 뭍이 멀어진다","임금은 나를 버 const q = document.getElementById('q');
const box = document.getElementById('results');
const count = document.getElementById('count');

function esc(s){
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
}
function mark(line, term){
  const i = line.toLowerCase().indexOf(term);
  if (i < 0) return esc(line);
  return esc(line.slice(0, i)) + '<em>' + esc(line.slice(i, i + term.length)) +
         '</em>' + esc(line.slice(i + term.length));
}

function search(term){
  term = term.trim().toLowerCase();
  box.innerHTML = '';
  if (term.length < 1) {
    count.textContent = '';
    box.innerHTML = '<p class="empty">Search any line.<br>' +
                    'One word you remember is enough.</p>';
    return;
  }

  let total = 0, shown = 0;
  const frag = document.createDocumentFragment();

  for (const t of DATA) {
    const hits = [];
    for (let i = 0; i < t.L.length; i++) {
      if (t.L[i] && t.L[i].toLowerCase().includes(term)) hits.push([t.L[i], t.E[i] || '']);
    }
    if (!hits.length) {
      for (let i = 0; i < t.E.length; i++) {
        if (t.E[i] && t.E[i].toLowerCase().includes(term)) hits.push([t.L[i] || '', t.E[i]]);
      }
    }
    if (!hits.length) continue;
    total += hits.length;
    if (shown >= 40) continue;
    shown++;

    const a = document.createElement('a');
    a.className = 'hit ' + t.tri;
    a.href = '../' + t.url;
    let html = '<p class="meta">CH. ' + t.a + ' · ' + esc(t.aen) + '</p>' +
               '<p class="ttl"><span>' + String(t.t).padStart(2,'0') + '</span>' +
               esc(t.en || t.kr) + '</p>';
    for (const [kr, en] of hits.slice(0, 3)) {
      if (en) html += '<p class="line">' + mark(en, term) + '</p>';
      if (kr) html += '<p class="line en">' + mark(kr, term) + '</p>';
    }
    if (hits.length > 3) html += '<p class="more">' + hits.length + ' matches in this song →</p>';
    a.innerHTML = html;
    frag.appendChild(a);
  }

  if (!total) {
    count.textContent = '';
    box.innerHTML = '<p class="empty">Nothing found.<br>Try another word.</p>';
    return;
  }
  count.textContent = total + ' matches in ' + shown + ' songs';
  box.appendChild(frag);
}

q.addEventListener('input', () => search(q.value));
document.querySelectorAll('.hint b').forEach(b => {
  b.addEventListener('click', () => { q.value = b.dataset.q; search(q.value); q.focus(); });
});
search('');
</script>
